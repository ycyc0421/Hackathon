name: Deploy frontend and backend
run-name: 前后端部署 · ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 发布过程中不取消任务，避免服务切换到一半被下一次提交中断。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  revision:
    name: 确认通过 CI 的主分支版本
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: 跳过过期提交，手动发布也必须已有成功的 CI
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          latest=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$REVISION" != "$latest" ]; then
            echo "::notice::主分支已有更新，跳过本次旧版本发布。"
            exit 0
          fi
          passed=$(gh run list --repo "$GH_REPO" --workflow ci.yml --commit "$REVISION" --event push --status success --json databaseId --jq length)
          test "$passed" -gt 0
          echo "sha=$REVISION" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: 部署后端与公网验证
    needs: revision
    if: needs.revision.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      BACKEND_SSH_HOST: ${{ secrets.BACKEND_SSH_HOST }}
      BACKEND_SSH_USER: ${{ secrets.BACKEND_SSH_USER }}
      RELEASE_ID: ${{ needs.revision.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 重试时也确认发布版本仍是最新 main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ needs.revision.outputs.sha }}
        run: |
          latest=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$REVISION" != "$latest" ]; then
            echo "::error::main 已更新，请运行最新版本的完整部署。"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查联调配置
        env:
          BACKEND_SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          BACKEND_SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_SSH_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit

          required = ("VITE_API_BASE", "FRONTEND_ORIGIN", "BACKEND_SSH_HOST", "BACKEND_SSH_USER", "BACKEND_SSH_KEY", "BACKEND_SSH_KNOWN_HOSTS")
          for name in required:
              if not os.environ.get(name):
                  raise SystemExit(f"production 环境缺少配置：{name}")
          api = urlsplit(os.environ["VITE_API_BASE"])
          if api.scheme != "https" or not api.hostname or api.path != "/api/v1" or api.query or api.fragment or api.username or api.password:
              raise SystemExit("VITE_API_BASE 必须是以 /api/v1 结尾的 HTTPS 地址，不带尾斜杠、查询参数或凭据")
          origin = urlsplit(os.environ["FRONTEND_ORIGIN"])
          if origin.scheme != "https" or not origin.hostname or origin.path not in ("", "/") or origin.query or origin.fragment or origin.username or origin.password:
              raise SystemExit("FRONTEND_ORIGIN 必须是前端站点的 HTTPS 源地址")
          if not re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9.-]*", os.environ["BACKEND_SSH_HOST"]):
              raise SystemExit("BACKEND_SSH_HOST 需为域名或 IPv4 地址")
          user = os.environ["BACKEND_SSH_USER"]
          if user == "root" or not re.fullmatch(r"[a-z_][a-z0-9_-]*", user):
              raise SystemExit("BACKEND_SSH_USER 必须是普通维护用户")
          PY

      - name: 预先构建联调前端（尚未发布）
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 保存供前端部署使用的构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: 准备部署密钥和服务器指纹
        env:
          BACKEND_SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          BACKEND_SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$BACKEND_SSH_KEY" > "$RUNNER_TEMP/backend_key"
          printf '%s\n' "$BACKEND_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/backend_known_hosts"

      - name: 发布独立后端版本
        id: backend
        run: |
          ssh_options=(-i "$RUNNER_TEMP/backend_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/backend_known_hosts")
          target="$BACKEND_SSH_USER@$BACKEND_SSH_HOST"
          git archive --format=tar.gz --output="$RUNNER_TEMP/$RELEASE_ID.tar.gz" HEAD
          ssh "${ssh_options[@]}" "$target" 'mkdir -p app/incoming'
          scp "${ssh_options[@]}" "$RUNNER_TEMP/$RELEASE_ID.tar.gz" "$target:app/incoming/$RELEASE_ID.tar.gz"
          ssh "${ssh_options[@]}" "$target" "python3 - $RELEASE_ID" < deploy/backend.py

      - name: 验证公网接口、上传轮询及返回契约
        id: smoke
        env:
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/backend-smoke
        run: |
          npm ci
          ssh_options=(-i "$RUNNER_TEMP/backend_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/backend_known_hosts")
          target="$BACKEND_SSH_USER@$BACKEND_SSH_HOST"
          python3 - <<'PY' | ssh "${ssh_options[@]}" "$target" "cd app/releases/$RELEASE_ID && .venv/bin/python deploy/smoke.py smoke-output"
          import json, os
          print(json.dumps({name: os.environ[name] for name in ("VITE_API_BASE", "FRONTEND_ORIGIN")}))
          PY
          mkdir -p "$SMOKE_OUTPUT_DIR"
          scp "${ssh_options[@]}" "$target:app/releases/$RELEASE_ID/smoke-output/*.json" "$SMOKE_OUTPUT_DIR/"
          node backend/tools/validate_outputs.mjs "$SMOKE_OUTPUT_DIR"

      - name: 公网联调失败时回退后端
        if: failure() && steps.backend.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: |
          ssh -i "$RUNNER_TEMP/backend_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/backend_known_hosts" "$BACKEND_SSH_USER@$BACKEND_SSH_HOST" "python3 - $RELEASE_ID --rollback" < deploy/backend.py

      - name: 清理临时密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/backend_key" "$RUNNER_TEMP/backend_known_hosts"

      - name: 记录后端部署结果
        run: |
          {
            echo '## 后端部署与公网验证通过'
            echo '后端版本已切换，跨域预检、样例上传轮询和返回契约校验均通过。'
            echo '前端尚待后续「部署前端到 Cloudflare」job 发布，请以该 job 的结果确认前端状态。'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: 部署前端到 Cloudflare
    needs: [revision, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 重试时也确认发布版本仍是最新 main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ needs.revision.outputs.sha }}
        run: |
          latest=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$REVISION" != "$latest" ]; then
            echo "::error::main 已更新，请运行最新版本的完整部署。"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 取回同一次部署的前端构建产物
        uses: actions/download-artifact@v5
        with:
          name: frontend-production
          path: web/dist/

      - name: 安装 Worker 依赖
        working-directory: worker
        run: npm ci

      - name: 发布前端静态资源与 Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: 记录前端部署结果
        run: |
          {
            echo '## 前后端部署完成'
            echo '后端已通过公网验证，前端静态资源与 Worker 已发布。'
            echo '前端默认仍使用示例模式；联调时在顶栏切换到「真实后端」，或使用 ?mock=0。'
          } >> "$GITHUB_STEP_SUMMARY"
