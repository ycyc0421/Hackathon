name: CI
run-name: CI 验证（不部署）· ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main, web/*]
  pull_request:
    branches: [main]

jobs:
  backend-regression:
    name: 后端语义与契约回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci

      - name: 比对及审查边界
        run: |
          python backend/tools/test_compare.py
          python backend/tools/test_review_regressions.py
          python backend/tools/test_paddle_adapter.py

      - name: 接口与金标
        run: |
          python backend/tools/selftest.py
          python backend/tools/run_challenge.py

      - name: 数据层回归
        run: python -m unittest discover -s data -p 'test_*.py' -v

      - name: 部署脚本与回退单元测试（不发布服务）
        run: |
          python -m unittest discover -s deploy -p 'test_*.py' -v
          python -m py_compile deploy/smoke.py

  validate-contract:
    name: 验证数据契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 契约校验
        run: npm run validate

  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 前端逻辑回归
        run: node --test tests/*.test.mjs

      - name: 构建
        working-directory: web
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

      - name: 说明验证与部署的区别
        if: always()
        run: |
          {
            echo '## CI 仅验证，不部署'
            echo '本次运行执行测试、契约校验和前端构建；构建产物上传不代表线上服务已更新。'
            echo '只有 main 的 push CI 成功后，才会触发独立的 Deploy frontend and backend 工作流；PR 验证不部署。'
            echo '请在部署运行中查看「发布整站与公网验证」的结果；过期提交会跳过部署。'
            echo "[打开部署工作流]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/deploy.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
