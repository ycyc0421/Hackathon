name: CI

on:
  push:
    branches: [main, web/*]
  pull_request:
    branches: [main]

jobs:
  backend-regression:
    name: 后端语义与契约回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci

      - name: 比对及审查边界
        run: |
          python backend/tools/test_compare.py
          python backend/tools/test_review_regressions.py

      - name: 接口与金标
        run: |
          python backend/tools/selftest.py
          python backend/tools/run_challenge.py

      - name: 数据层回归
        run: python -m unittest discover -s data -p 'test_*.py' -v

      - name: 部署与回退验证
        run: |
          python -m unittest discover -s deploy -p 'test_*.py' -v
          node --check deploy/smoke.mjs

  validate-contract:
    name: 验证数据契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 契约校验
        run: npm run validate

  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 前端逻辑回归
        run: node --test tests/*.test.mjs

      - name: 构建
        working-directory: web
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7
