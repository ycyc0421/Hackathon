name: CI
run-name: CI 验证（不部署）· ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main, web/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-regression:
    name: 后端语义与契约回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: |
          python -m pip install -r backend/requirements.txt -r requirements-test.txt
          npm ci

      - name: 自动发现后端测试（含接口、样例金标和契约）
        run: >-
          python -m pytest
          --junitxml=backend/.out/junit.xml
          --basetemp=backend/.out/pytest-tmp
          --durations=10

      - name: 保留测试报告与接口返回
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/.out/junit.xml
            backend/.out/pytest-tmp/**/*.json
          include-hidden-files: true
          retention-days: 7

  python-support-tests:
    name: Python 支持回归（${{ matrix.suite }}）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [data, deploy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: 安装测试工具
        run: python -m pip install -r requirements-test.txt

      - name: 数据层或部署脚本回归（不发布服务）
        run: python -m pytest ${{ matrix.suite }} --junitxml=.out/${{ matrix.suite }}.xml

      - name: 保留测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-test-results
          path: .out/${{ matrix.suite }}.xml
          include-hidden-files: true
          retention-days: 7

  validate-contract:
    name: 验证数据契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 契约校验
        run: |
          npm run validate
          node backend/tools/validate_reports.mjs

  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装契约与前端依赖
        run: |
          npm ci
          npm ci --prefix web

      - name: 前端逻辑回归
        run: node --test tests/*.test.mjs

      - name: 构建
        working-directory: web
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

      - name: 说明验证与部署的区别
        if: always()
        run: |
          {
            echo '## CI 仅验证，不部署'
            echo '本次运行执行测试、契约校验和前端构建；构建产物上传不代表线上服务已更新。'
            echo '只有 main 的 push CI 成功后，才会触发独立的 Deploy frontend and backend 工作流；PR 验证不部署。'
            echo '请在部署运行中查看「发布整站与公网验证」的结果；过期提交会跳过部署。'
            echo "[打开部署工作流]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/deploy.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
